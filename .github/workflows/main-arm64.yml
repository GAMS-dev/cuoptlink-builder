name: Build cuOpt link for GAMS (ARM64)

on:
  push:
#    branches: [main]
    tags:
      - '*'        # Run only when a new tag is pushed
  pull_request:
  workflow_dispatch:

jobs:
  build-link:
    runs-on: ubuntu-24.04-arm
    container:
      image: python:3.13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y patchelf curl unzip zip gcc
          pip install uv

      # Get CUDA runtimes via pip
      - name: Set up python virtual environments with NVIDIA dependencies for CUDA 12 and CUDA 13 (respectively)
        run: |
          mkdir -p venvs
          uv venv venvs/cu12
          uv pip install --python venvs/cu12 --extra-index-url=https://pypi.nvidia.com 'cuopt-cu12==26.8.*' -qq
          uv venv venvs/cu13
          uv pip install --python venvs/cu13 --extra-index-url=https://pypi.nvidia.com 'cuopt-cu13==26.8.*' -qq

      # Get GAMS (ARM64 version)
      - name: Download and extract latest GAMS distribution
        run: |
          curl https://d37drm4t2jghv5.cloudfront.net/distributions/latest/linux/linux_arm64_sfx.exe --output linux_arm64_sfx.exe
          unzip -q linux_arm64_sfx.exe
          mv gams*_linux_arm64_sfx gamsdist
          rm linux_arm64_sfx.exe

      # Build link
      - name: Compile GAMS/cuOpt-link binary "gmscuopt.out" for CUDA 12 and then for CUDA 13
        run: |
          export GAMSCAPI="gamsdist/apifiles/C/api"
          export CUOPT="venvs/cu12/lib/python3.13/site-packages/libcuopt"
          export JITLINK="venvs/cu12/lib/python3.13/site-packages/nvidia/nvjitlink/lib"
          export CUOPT_VERSION="`cat "$CUOPT/VERSION"`"
          export CUOPT_HASH="`cat "$CUOPT/GIT_COMMIT"`"
          gcc -Wall gmscuopt.c -o gmscuopt-cu12.out \
            -DCUOPT_VERSION=\"$CUOPT_VERSION\" -DCUOPT_HASH=\"$CUOPT_HASH\" \
            -I $GAMSCAPI $GAMSCAPI/gmomcc.c $GAMSCAPI/optcc.c $GAMSCAPI/gevmcc.c \
            -I $CUOPT/include $JITLINK/libnvJitLink.so.12 -L $CUOPT/lib64 -lcuopt
          patchelf --set-rpath \$ORIGIN gmscuopt-cu12.out
          export CUOPT="venvs/cu13/lib/python3.13/site-packages/libcuopt"
          export JITLINK="venvs/cu13/lib/python3.13/site-packages/nvidia/cu13/lib"
          export CUOPT_VERSION="`cat "$CUOPT/VERSION"`"
          export CUOPT_HASH="`cat "$CUOPT/GIT_COMMIT"`"
          gcc -Wall gmscuopt.c -o gmscuopt-cu13.out \
            -DCUOPT_VERSION=\"$CUOPT_VERSION\" -DCUOPT_HASH=\"$CUOPT_HASH\" \
            -I $GAMSCAPI $GAMSCAPI/gmomcc.c $GAMSCAPI/optcc.c $GAMSCAPI/gevmcc.c \
            -I $CUOPT/include $JITLINK/libnvJitLink.so.13 -L $CUOPT/lib64 -lcuopt
          patchelf --set-rpath \$ORIGIN gmscuopt-cu13.out

      # Collect dependencies for link and runtime convenience archive
      - name: Prepare release artifact and runtime bundle
        run: |
          mkdir release-cu12
          cp gmscuopt-cu12.out release-cu12/gmscuopt.out
          cp assets/* release-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/libcuopt/lib64/libcuopt.so release-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/libraft_cu12.libs/libgomp-*.so* release-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/libcuopt_cu12.libs/libtbb-*.so* release-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/libcuopt_cu12.libs/libtbbmalloc-*.so* release-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/libcuopt_cu12.libs/libomp-*.so* release-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/rapids_logger/lib64/librapids_logger.so release-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/librmm/lib64/librmm.so release-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/nvidia/nccl/lib/libnccl.so* release-cu12/
          mkdir runtime-cu12
          cp venvs/cu12/lib/python3.13/site-packages/nvidia/cu12/lib/libcudss.so* runtime-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/nvidia/cu12/lib/libcudss_mtlayer_gomp.so* runtime-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/nvidia/cusolver/lib/libcusolver.so* runtime-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/nvidia/cublas/lib/libcublas.so* runtime-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/nvidia/cublas/lib/libcublasLt.so* runtime-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/nvidia/nvjitlink/lib/libnvJitLink.so* runtime-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/nvidia/curand/lib/libcurand.so* runtime-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/nvidia/cusparse/lib/libcusparse.so* runtime-cu12/
          cp venvs/cu12/lib/python3.13/site-packages/libcuopt_cu12.libs/libcares-*.so* runtime-cu12/
          mkdir release-cu13
          cp gmscuopt-cu13.out release-cu13/gmscuopt.out
          cp assets/* release-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/libcuopt/lib64/libcuopt.so release-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/libraft_cu13.libs/libgomp-*.so* release-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/libcuopt_cu13.libs/libtbb-*.so* release-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/libcuopt_cu13.libs/libtbbmalloc-*.so* release-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/libcuopt_cu13.libs/libomp-*.so* release-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/rapids_logger/lib64/librapids_logger.so release-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/librmm/lib64/librmm.so release-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/nvidia/nccl/lib/libnccl.so* release-cu13/
          mkdir runtime-cu13
          cp venvs/cu13/lib/python3.13/site-packages/nvidia/cu13/lib/libcudss.so* runtime-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/nvidia/cu13/lib/libcudss_mtlayer_gomp.so* runtime-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/nvidia/cu13/lib/libnvJitLink.so* runtime-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/nvidia/cu13/lib/libcublas.so* runtime-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/nvidia/cu13/lib/libcublasLt.so* runtime-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/nvidia/cu13/lib/libcurand.so* runtime-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/nvidia/cu13/lib/libcusolver.so* runtime-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/nvidia/cu13/lib/libcusparse.so* runtime-cu13/
          cp venvs/cu13/lib/python3.13/site-packages/libcuopt_cu13.libs/libcares-*.so* runtime-cu13/

      # Smoke-test the built link: models using GAMS constructs cuOpt does not
      # support (SOS1/SOS2/semi-integer variables) must be explicitly rejected
      # with a clear error instead of being silently mis-solved. This needs no
      # GPU, since the rejection happens before any GPU work is done.
      - name: Run capability-rejection tests
        run: |
          EXPECTED="ERROR: cuOpt does not support SOS1, SOS2, or semi-integer variables."
          for cuda_dir in release-cu12 release-cu13; do
            cp "$cuda_dir"/* gamsdist/
            # GAMS only auto-registers solvers from a file literally named
            # gamsconfig.yaml, not gamsconfig_cuopt.yaml (see README's manual
            # installation instructions, which rely on this rename/overwrite).
            cp "$cuda_dir/gamsconfig_cuopt.yaml" gamsdist/gamsconfig.yaml
            for model in examples/models/capability_tests/*.gms; do
              name=$(basename "$model" .gms)
              lst="${cuda_dir}_${name}.lst"
              log="${cuda_dir}_${name}.log"
              set +e
              gamsdist/gams "$model" mip=cuopt lo=3 o="$lst" > "$log" 2>&1
              rc=$?
              set -e
              if ! grep -qF "$EXPECTED" "$lst" 2>/dev/null; then
                echo "FAIL ($cuda_dir): $model was not rejected as expected (gams exit code $rc)"
                echo "--- $log ---"; cat "$log" 2>/dev/null || echo "(missing)"
                echo "--- $lst ---"; cat "$lst" 2>/dev/null || echo "(missing)"
                exit 1
              fi
              echo "OK ($cuda_dir): $model correctly rejected"
            done
          done

      # Upload artifacts
      - name: Upload CUDA 12 link artifact to GitHub Actions (always)
        uses: actions/upload-artifact@v6
        with:
          name: cuopt-link-cu12-arm64
          path: release-cu12/

      - name: Upload CUDA 12 runtime artifact to GitHub Actions (always)
        uses: actions/upload-artifact@v6
        with:
          name: cu12-runtime-arm64
          path: runtime-cu12/

      - name: Upload CUDA 13 link artifact to GitHub Actions (always)
        uses: actions/upload-artifact@v6
        with:
          name: cuopt-link-cu13-arm64
          path: release-cu13/

      - name: Upload CUDA 13 runtime artifact to GitHub Actions (always)
        uses: actions/upload-artifact@v6
        with:
          name: cu13-runtime-arm64
          path: runtime-cu13/

      # Zip Files
      - name: Create zip archive (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd release-cu12
          zip -r ../cuopt-link-release-cu12-arm64.zip .
          cd ../runtime-cu12
          zip -r ../cu12-runtime-arm64.zip .
          cd ../release-cu13
          zip -r ../cuopt-link-release-cu13-arm64.zip .
          cd ../runtime-cu13
          zip -r ../cu13-runtime-arm64.zip .

      # Create new release with archives
      - name: Create GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cuopt-link-release-cu12-arm64.zip
            cu12-runtime-arm64.zip
            cuopt-link-release-cu13-arm64.zip
            cu13-runtime-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
